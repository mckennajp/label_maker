[project]
name = "m100"
version = "0.1.0"
description = "Serial client for the Ponek M100 Aimotech label printer"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "pillow>=10", "cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
