<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M100 Label</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">M100</div>
    <div id="status" class="status unknown">not connected</div>
    <button id="connect-bt" type="button" class="icon-btn" title="Connect Bluetooth" aria-label="Connect Bluetooth">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5L7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="connect-serial" type="button" class="icon-btn" title="Connect serial" aria-label="Connect serial">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h8v8H8zM12 4v4M12 16v4M4 12h4M16 12h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="disconnect" type="button" class="icon-btn" hidden title="Disconnect" aria-label="Disconnect">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 8l-8 8M8 8l8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <label class="copies">Copies <input id="copies" type="number" min="1" max="20" value="1" /></label>
    <button id="print" type="button">Print</button>
  </header>

  <main>
    <aside>
      <div class="tool-row">
        <button type="button" data-add="text" class="icon-btn" title="Add text" aria-label="Add text">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v14M8 20h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="add-image" class="icon-btn" title="Add image" aria-label="Add image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="M6 17l4.5-5 3 3.5 2-2L18 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="add-qr" class="icon-btn" title="Add QR code" aria-label="Add QR code">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h6v6H5zm8 0h6v6h-6zM5 13h6v6H5zm8 2h2v2h-2zm4-2h2v2h-2zm-2 2h2v2h-2zm2 2h2v2h-2z" fill="currentColor"/></svg>
        </button>
        <button type="button" id="add-border" class="icon-btn" title="Add border" aria-label="Add border">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="7" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/></svg>
        </button>
        <button type="button" id="toggle-grid" class="icon-btn" title="Show grid" aria-label="Show grid" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5zM5 9h14M5 15h14M9 5v14M15 5v14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
      <input id="file" type="file" accept="image/*" hidden />
      <div class="tool-row">
        <button type="button" id="bring-front" class="icon-btn" disabled title="Bring to front" aria-label="Bring to front">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l-6 6h4v8h4v-8h4z" fill="currentColor"/></svg>
        </button>
        <button type="button" id="send-back" class="icon-btn" disabled title="Send to back" aria-label="Send to back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19l6-6h-4V5h-4v8H6z" fill="currentColor"/></svg>
        </button>
        <button type="button" id="delete" class="icon-btn" disabled title="Delete" aria-label="Delete">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M9 7V5h6v2m-7 0l.8 12h7.4L17 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <details class="settings">
        <summary>Settings</summary>
        <label class="size-pick">Label size
          <select id="label-size">
            <option value="40x30">40 × 30 mm</option>
            <option value="30x40">30 × 40 mm</option>
            <option value="40x60">40 × 60 mm</option>
            <option value="60x40">60 × 40 mm</option>
          </select>
        </label>
      </details>
      <hr />
      <div id="props" class="props muted">Select an object</div>
    </aside>
    <section class="stage">
      <div class="label-wrap">
        <canvas id="label" width="320" height="240" tabindex="0"></canvas>
      </div>
      <p class="hint">40 × 30 mm · paste or add an image · drag to move · corner handles to scale</p>
    </section>
  </main>

  <div id="toast" hidden></div>
  <div id="border-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <strong>Choose a border</strong>
        <button type="button" id="border-close" aria-label="Close">×</button>
      </div>
      <h3>Decorative</h3>
      <div id="borders-Decorative" class="gallery"></div>
      <h3>Holiday</h3>
      <div id="borders-Holiday" class="gallery"></div>
    </div>
  </div>
  <script src="/qrcode-lib.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
